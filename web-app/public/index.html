<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axle Measurement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>Axle Measurement</h1>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Login</button>
                <div id="login-error" class="error" hidden></div>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen" hidden>
        <!-- Top Bar -->
        <div id="top-bar">
            <div id="top-bar-left">
                <span id="app-title">Axle Measurement</span>
                <div id="cal-status">
                    <span id="cal-indicator" class="not-calibrated">NOT CALIBRATED</span>
                </div>
            </div>
            <div id="top-bar-right">
                <span id="user-info"></span>
                <button id="btn-history" title="Measurement History">History</button>
                <button id="btn-calibrate" title="Calibration (Admin)" hidden>Calibrate</button>
                <button id="btn-logout">Logout</button>
            </div>
        </div>

        <!-- Main Content Area: Video + Side Panel -->
        <div id="main-content">
            <!-- Video + Overlay Container -->
            <div id="video-container">
                <video id="camera-feed" autoplay muted loop playsinline></video>
                <canvas id="overlay"></canvas>

                <!-- Measurement Display -->
                <div id="measurement-display" hidden>
                    <span id="measurement-value">--</span>
                </div>

                <!-- Line Labels -->
                <div id="line1-label" class="line-label" hidden>Line 1</div>
                <div id="line2-label" class="line-label" hidden>Line 2</div>
            </div>

            <!-- Right Side Control Panel -->
            <div id="side-panel">
                <!-- Date/Time Clock -->
                <div class="panel-section">
                    <div id="panel-clock" class="panel-clock"></div>
                </div>
                <div class="panel-divider"></div>

                <!-- Weight Display (top) -->
                <div class="panel-section" id="weight-panel" hidden>
                    <div class="panel-label">MAX WEIGHT <button id="btn-weight-info" style="background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:0 2px;vertical-align:middle" title="How is this calculated?">&#9432;</button></div>
                    <div id="weight-max" class="panel-big-value">--</div>
                    <div id="weight-scale-line" hidden>
                        <div class="panel-label">SCALE</div>
                        <div id="weight-scale" class="panel-big-value">--</div>
                    </div>
                    <div id="weight-status" hidden></div>
                    <div class="panel-divider"></div>
                    <div class="panel-label">AXLES</div>
                    <div class="panel-axle-row">
                        <button class="axle-btn" id="btn-axle-minus">-</button>
                        <span id="axle-count-display">5</span>
                        <button class="axle-btn" id="btn-axle-plus">+</button>
                    </div>
                    <div class="panel-axle-spacer"></div>
                    <div style="display:flex;align-items:center;justify-content:center;gap:4px">
                        <label class="panel-toggle" title="Dump truck, concrete mixer, waste, or fuel transport (70,000 lb cap)">
                            <input type="checkbox" id="chk-special">
                            <span class="toggle-switch"></span>
                            <span class="toggle-label">Dump/Mix</span>
                        </label>
                        <button id="btn-special-info" style="background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:0 2px" title="What is Dump/Mix?">&#9432;</button>
                    </div>
                </div>

                <!-- Divider -->
                <div class="panel-divider"></div>

                <!-- Actions -->
                <div class="panel-section">
                    <button id="btn-save-measurement" class="panel-btn panel-btn-save" disabled>Save</button>
                    <button id="btn-reset-lines" class="panel-btn panel-btn-reset">Reset</button>
                </div>

                <!-- Divider -->
                <div class="panel-divider"></div>

                <!-- Mode Toggle Button -->
                <div class="panel-section">
                    <div class="panel-label">MODE</div>
                    <button id="mode-indicator" class="panel-btn mode-coarse">COARSE</button>
                </div>

                <!-- Spacer pushes keyboard hints to bottom -->
                <div class="panel-spacer"></div>

                <!-- Keyboard Hints -->
                <div class="panel-section panel-hints">
                    <div><kbd>A</kbd><kbd>D</kbd> Line 1</div>
                    <div><kbd>J</kbd><kbd>L</kbd> Line 2</div>
                    <div><kbd>F</kbd> Fine/Coarse</div>
                    <div><kbd>Space</kbd> Save</div>
                    <div><kbd>R</kbd> Reset</div>
                </div>
            </div>
        </div>

        <!-- Calibration Panel (compact, bottom-right corner) -->
        <div id="calibration-modal" class="cal-panel" hidden>
            <div class="cal-panel-content">
                <div class="cal-header">
                    <strong>CALIBRATION MODE</strong>
                    <span class="cal-hint">Move lines to reference markers</span>
                </div>
                <div class="cal-stats">
                    <span>Px dist: <strong id="cal-pixel-dist">--</strong></span>
                </div>
                <div class="cal-distance-input">
                    <label>Known distance:</label>
                    <div class="cal-feet-inches">
                        <input type="number" id="cal-feet" min="0" max="200" step="1" placeholder="ft" class="cal-input-sm">
                        <span>ft</span>
                        <input type="number" id="cal-inches" min="0" max="11" step="1" placeholder="in" class="cal-input-sm">
                        <span>in</span>
                    </div>
                </div>
                <div class="cal-actions">
                    <button id="btn-cal-save">Save</button>
                    <button id="btn-cal-cancel" class="secondary">Cancel</button>
                </div>
                <div id="cal-error" class="error" hidden></div>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-modal" class="modal" hidden>
            <div class="modal-content modal-wide">
                <h2>Measurement History</h2>
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Date/Time</th>
                            <th>Distance</th>
                            <th>Axles</th>
                            <th>Max Weight</th>
                            <th>Operator</th>
                            <th>Image</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
                <div class="modal-buttons">
                    <button id="btn-history-close" class="secondary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
